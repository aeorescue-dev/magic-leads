name: Scraper Cron Job (SQLite)

on:
  schedule:
    - cron: '0 */6 * * *'  # A cada 6 horas
  workflow_dispatch:       # Permite rodar manualmente

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run scraper (insere no SQLite)
        run: |
          python -c "
          import time, sys
          from fastapi.testclient import TestClient
          from backend.main import app
          from backend.services.db import db_service

          client = TestClient(app)

          # POST com retry: 3 tentativas, 15s de intervalo
          resp = None
          for attempt in range(1, 4):
              try:
                  resp = client.post('/api/scraper/run')
                  break
              except Exception as e:
                  print('Tentativa %d/3 falhou: %s' % (attempt, e))
                  if attempt < 3:
                      time.sleep(15)
                  else:
                      print('Todas as tentativas de POST falharam')
                      sys.exit(1)

          start = resp.json()
          print('HTTP:', resp.status_code, '| Resposta:', start)

          assert resp.status_code in (200, 202, 409), 'HTTP %s: %s' % (resp.status_code, resp.text)
          assert start.get('status') in ('started', 'already_running'), start

          if start.get('status') == 'already_running':
              print('Run ja em execucao em outro processo — seguindo ciclo existente.')
          else:
              # Poll com retry: se GET falhar, retenta antes de desistir
              for i in range(60):
                  for poll_attempt in range(3):
                      try:
                          st = client.get('/api/scraper/status').json()
                          break
                      except Exception as e:
                          print('Poll tentativa %d/3 falhou: %s' % (poll_attempt + 1, e))
                          if poll_attempt < 2:
                              time.sleep(5)
                          else:
                              st = {}
                  if not (st.get('active') and st.get('running')):
                      print('Run concluido:', st)
                      break
                  print('Aguardando conclusao (iteracao %d/60)...' % (i + 1))
                  time.sleep(10)
              else:
                  print('Aviso: run ainda ativo apos ~10min — seguindo com o que ja foi inserido.')

          print('Total no banco:', db_service._service.count_leads())
          "

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout master
          git add data/leads.db -f
          git commit -m "chore(data): atualizar leads do scraper [skip ci]" || echo "Nenhuma mudança para commitar"
          git pull --rebase origin master
          git push origin master