name: Scraper Cron Job (SQLite)

on:
  schedule:
    - cron: '0 */6 * * *'  # A cada 6 horas
  workflow_dispatch:       # Permite rodar manualmente

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run scraper (insere no SQLite)
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          from backend.services.db import db_service

          client = TestClient(app)
          resp = client.post('/api/scraper/run')
          print('Resultado:', resp.json())
          print('Total no banco:', db_service._service.count_leads())
          assert resp.status_code == 200, resp.text
          "

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leads.db -f
          git commit -m "chore(data): atualizar leads do scraper [skip ci]" || echo "Nenhuma mudança para commitar"
          git push