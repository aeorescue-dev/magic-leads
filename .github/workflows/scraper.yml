name: Scraper Nacional 311

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-nacional
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Disparar scraper na producao (Railway)
        run: |
          # Retry policy: 3 tentativas com 15s de intervalo em caso de falha HTTP/conexao
          code=$(curl --retry 3 --retry-delay 15 --retry-all-errors \
            -sS -o /tmp/start.json -w "%{http_code}" -m 30 \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -X POST "https://magic-leads-production.up.railway.app/api/scraper/run?max_cities=8") || true
          echo "http_code: $code"
          echo "start: $(cat /tmp/start.json 2>/dev/null || echo '{"status":"error"}')"

          start=$(cat /tmp/start.json 2>/dev/null || echo '{}')
          status=$(echo "$start" | jq -r '.status // empty')
          run_id=$(echo "$start" | jq -r '.run_id // empty')

          # Aceita "started" (criado) e "already_running" (reentrante) sem falhar:
          if [ "$code" = "409" ] || [ "$status" = "already_running" ]; then
            echo "Scraper ja em execucao (run reentrante) — seguindo ciclo existente."
          elif [ "$status" = "started" ]; then
            echo "Run disparado: ${run_id:-<sem run_id>}"
          else
            echo "Resposta inesperada do /api/scraper/run — continuando para checar /api/scraper/status"
            run_id=""
          fi

          # Se nao tivemos run_id, deriva do run ativo no status
          if [ -z "$run_id" ]; then
            st=$(curl --retry 3 --retry-delay 10 --retry-all-errors \
              -sS -m 30 "https://magic-leads-production.up.railway.app/api/scraper/status") || true
            echo "status: $st"
            run_id=$(echo "$st" | jq -r '.running | keys[0] // empty')
            echo "run_id derivado: ${run_id:-<nenhum ativo>}"
          fi

          # Poll em /api/scraper/status ate o ciclo terminar (ativa fica false)
          for i in $(seq 1 55); do
            sleep 60
            st=$(curl --retry 3 --retry-delay 10 --retry-all-errors \
              -sS -m 30 "https://magic-leads-production.up.railway.app/api/scraper/status") || true
            if [ "$(echo "$st" | jq -r '.active')" = "false" ]; then
              echo "Scraper concluido:"
              echo "$st"
              lstatus=$(echo "$st" | jq -r '.last_run.status // "unknown"')
              if [ "$lstatus" = "success" ]; then
                echo "Status final do run: success"
              else
                echo "Aviso: status final do run = $lstatus (inspecionar logs)"
              fi
              exit 0
            fi
            echo "Aguardando conclusao (iteracao $i/55)..."
          done
          echo "Ainda ativo apos 55min — run continua em background (job sai sem erro)"
          exit 0