name: CI - Import & Syntax Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  import-and-syntax-check:
    name: Import & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx fastapi uvicorn

      - name: Run full backend test suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -q --cov=backend --cov-report=term --cov-report=json:coverage.json

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.json
          if-no-files-found: warn

      - name: Syntax check (ruff)
        working-directory: ./backend
        run: |
          pip install ruff
          ruff check . --select=E,F,W,I --ignore=E501 --output-format=github

  frontend-type-check:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build (generate types + validate)
        working-directory: ./frontend
        run: npx next build

      - name: TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true